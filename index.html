<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="사업공고">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=11">
<title>사업공고 알리미</title>
</head>
<body>
<header class="app-header">
  <div>
    <p class="eyebrow">KOREA PUBLIC FUNDING</p>
    <h1>사업공고 알리미</h1>
    <p class="subtitle">정부·지자체·공공기관 지원사업을 한곳에서 확인합니다.</p>
  </div>
  <button id="refreshBtn" class="icon-btn" aria-label="새로고침">↻</button>
</header>

<main>
  <section class="search-panel">
    <label class="search-box">
      <span>⌕</span>
      <input id="keywordInput" type="search" placeholder="예: 수출, 창업, 의료기기, AI">
    </label>
    <div class="filters">
      <select id="regionFilter" aria-label="지역">
        <option value="">전국</option><option>서울</option><option>부산</option><option>대구</option><option>인천</option><option>광주</option><option>대전</option><option>울산</option><option>세종</option><option>경기</option><option>강원</option><option>충북</option><option>충남</option><option>전북</option><option>전남</option><option>경북</option><option>경남</option><option>제주</option>
      </select>
      <select id="categoryFilter" aria-label="분야">
        <option value="">전체 분야</option><option>금융</option><option>기술</option><option>인력</option><option>수출</option><option>내수</option><option>창업</option><option>경영</option><option>기타</option>
      </select>
      <select id="sortFilter" aria-label="정렬">
        <option value="latest">최신순</option><option value="deadline">마감 임박순</option>
      </select>
    </div>
  </section>

  <section class="summary-row">
    <article><strong id="totalCount">0</strong><span>검색 공고</span></article>
    <article><strong id="urgentCount">0</strong><span>7일 이내 마감</span></article>
    <article><strong id="savedCount">0</strong><span>관심 공고</span></article>
  </section>

  <div class="tabbar" role="tablist">
    <button id="allTab" class="active" type="button">전체</button>
    <button id="urgentTab" type="button">마감 임박</button>
    <button id="savedTab" type="button">관심</button>
  </div>

  <section id="status" class="status">공고를 불러오는 중입니다…</section>
  <section id="noticeList" class="notice-list" aria-live="polite"></section>
</main>

<dialog id="detailDialog">
  <div class="dialog-head"><h2 id="detailTitle"></h2><button id="closeDialog" type="button">닫기</button></div>
  <div id="detailBody"></div>
</dialog>

<script src="config.js?v=11"></script>
<script src="app.js?v=11"></script>
</body>
</html>

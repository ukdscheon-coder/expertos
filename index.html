<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ExpertOS" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>ExpertOS — 분야별 AI 컨설턴트</title>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">GLOBAL EXPERT KNOWLEDGE</p>
      <h1>ExpertOS</h1>
      <p class="subtitle">검증된 출처를 기반으로 분야별 인사이트를 제공합니다.</p>
    </div>
    <button id="installBtn" class="install hidden">앱 설치</button>
  </header>

  <main>
    <section class="status-card">
      <div>
        <span class="live-dot"></span>
        <strong>오늘의 지식 브리핑</strong>
      </div>
      <span id="todayLabel"></span>
      <p>공식기관·학술·산업·전문가 채널을 출처 등급별로 분리합니다.</p>
    </section>

    <section>
      <div class="section-head">
        <h2>분야 선택</h2>
        <span>6개 분야</span>
      </div>
      <div id="categoryGrid" class="category-grid"></div>
    </section>

    <section id="briefingSection">
      <div class="section-head">
        <h2 id="briefingTitle">의료 브리핑</h2>
        <button id="refreshBtn" class="ghost-btn">새로고침</button>
      </div>
      <div id="briefingList" class="briefing-list"></div>
    </section>

    <section class="consultant">
      <div class="section-head">
        <h2>AI 컨설턴트</h2>
        <span id="selectedDomainLabel">의료</span>
      </div>
      <div class="chatbox" id="chatbox">
        <div class="message assistant">
          질문을 입력하면 현재 선택된 분야의 출처와 신뢰도 기준을 바탕으로 답변 구조를 보여드립니다.
        </div>
      </div>
      <form id="questionForm">
        <textarea id="questionInput" rows="3" placeholder="예: 최근 비만 치료제 시장의 핵심 변화는 무엇인가?"></textarea>
        <button type="submit">근거 기반 분석</button>
      </form>
      <p class="disclaimer">의료·법률·투자 관련 내용은 정보 제공용이며 전문 자문을 대체하지 않습니다.</p>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="active">오늘</button>
    <button id="sourcesBtn">출처</button>
    <button id="savedBtn">저장</button>
    <button id="settingsBtn">설정</button>
  </nav>

  <dialog id="modal">
    <div class="modal-head">
      <h3 id="modalTitle">출처</h3>
      <button id="closeModal">닫기</button>
    </div>
    <div id="modalBody"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>

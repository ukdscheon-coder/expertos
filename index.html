<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ExpertOS">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css?v=10">
<title>ExpertOS</title>
</head>
<body>
<header class="topbar">
  <div>
    <p class="eyebrow">GLOBAL EXPERT KNOWLEDGE</p>
    <h1>ExpertOS</h1>
    <p class="subtitle">질문을 입력하면 최신 근거를 조사해 답변합니다.</p>
  </div>
</header>
<main>
  <section class="consultant">
    <div class="section-head"><h2>전문가 컨설턴트</h2><span>Global Research</span></div>
    <div class="language-row">
      <label for="speechLanguage">음성 입력 언어</label>
      <select id="speechLanguage">
        <option value="auto">자동 감지</option>
        <option value="ko-KR">한국어</option>
        <option value="en-GB">English</option>
        <option value="ja-JP">日本語</option>
        <option value="zh-CN">中文</option>
        <option value="es-ES">Español</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
      </select>
    </div>
    <div class="chatbox" id="chatbox">
      <div class="message assistant">의료, 법률, 경제, AI, 교육, 과학, 사업 등 어떤 분야든 질문하세요.</div>
    </div>
    <form id="questionForm">
      <div class="input-wrap">
        <textarea id="questionInput" rows="5" placeholder="질문을 입력하거나 마이크를 누르세요."></textarea>
        <button type="button" id="micBtn" class="mic-btn" aria-label="음성 입력">🎙️</button>
      </div>
      <div id="speechStatus" class="speech-status">문자 입력 준비</div>
      <button type="submit" class="submit-btn">답변 받기</button>
    </form>
  </section>
</main>
<dialog id="voiceApprovalModal">
  <div class="modal-head"><h3>음성 출력 승인</h3><button id="cancelVoice">취소</button></div>
  <p>이 답변을 1회 음성으로 재생할까요?</p>
  <button id="approveVoice" class="approve-voice">승인하고 재생</button>
</dialog>
<script src="config.js?v=10"></script>
<script src="app.js?v=10"></script>
</body>
</html>
